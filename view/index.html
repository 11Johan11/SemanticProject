<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Drag and Drop</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- GridStack CSS -->
  <link rel="stylesheet" href="node_modules/gridstack/dist/gridstack.min.css" />

  <!--<link rel="stylesheet" href="styles.css">-->
<style>
  /* GridStack background + item styling */
  .grid-stack {
    background: linear-gradient(to bottom, #2b2b2b, #1a1a1a); /* Neutral gradient */
    min-height: 80vh; /* Ensure visibility */
    border-radius: 10px; /* Add slight rounding for a polished look */
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4); /* Subtle shadow for depth */
  }
  #recommendBtn {
  background: linear-gradient(to right, #20c997, #128f76); /* Green gradient */
  color: #fff;
  border: none;
  font-weight: bold;
  border-radius: 8px;
  padding: 10px 20px;
  transition: background 0.3s ease, transform 0.3s ease;
  }

  /* Clear button */
#clearAllBtn {
    background: #495057;
    color: #fff;
    border: none;
    border-radius: 8px;
  }

  #clearAllBtn:hover {
    color: #20c997; /* Change icon color on hover */
    transition: color 0.3s ease; /* Smooth hover effect */
    }

  .grid-stack-item {
    position: relative;
    overflow: hidden; /* Ensures content stays within bounds */
  }
  /* Search input styling */
  #search-input {
    background: #2c2c2c;
    color: #f8f9fa;
    border: 1px solid #495057;
    border-radius: 8px;
    padding: 8px;
    box-shadow: inset 0 1px 3px rgba(156, 146, 146, 0.5); /* Subtle inner shadow */
  }

  #search-input::placeholder {
  color: #868e96; /* Light gray color for placeholder */
  opacity: 1; /* Ensure it's fully visible */
  }

  body {
  background: radial-gradient(circle at center, #2c2c2c, #121212 60%); /* Radial gradient */
  background-attachment: fixed; /* Prevent scrolling background */
  color: #f8f9fa; /* Default light text */
  }

  #search-input:focus {
    outline: none;
    border-color: #20c997;
    box-shadow: 0 0 8px rgba(32, 201, 151, 0.5); /* Highlight effect */
  }

    
  .grid-stack-item-content, 
.draggable-widget.newWidget {
  background: linear-gradient(to bottom, #18bc9c, #128f76); /* Gradient for items */
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  font-weight: bold;
  text-align: center;
  border-radius: 6px; /* Slight rounding for smoothness */
  transition: transform 0.3s ease, box-shadow 0.3s ease; /* Smooth hover effects */
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4); /* Subtle shadow for depth */
}

/* Ensure hover effects apply to both */
.grid-stack-item-content:hover,
.draggable-widget.newWidget:hover {
  transform: scale(1.05); /* Slight zoom effect */
  box-shadow: 0 8px 15px rgba(0, 0, 0, 0.6); /* Stronger shadow on hover */
}

/* Banner and other internal styles remain consistent */
.widget-title-bar {
  position: relative;
  background-color: rgba(0, 0, 0, 0.6);
  color: white;
  padding: 10px;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
}

.grid-stack-item .rating-banner,
.draggable-widget.newWidget .rating-banner {
  position: absolute;
  top: 0;
  right: 0;
  width: 35px;
  height: 50px;
  background-color: #f1c40f; /* Yellow banner */
  color: black;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
  clip-path: polygon(
    0% 0%, 
    100% 0%, 
    100% 100%, 
    85% 100%, 
    50% 75%, 
    15% 100%, 
    0% 100%
  );
  z-index: 5;
}

      /* Input group container adjustments */
      .input-group-text {
        background: #1a1a1a; /* Black background */
        border: none; /* Remove any borders */
        padding: 0; /* Remove unnecessary padding */
        display: flex; /* Flexbox for alignment */
        align-items: center;
        justify-content: center;
        border-radius: 8px; /* Rounded corners */
        height: 40px; /* Adjust height to match input */
        width: 40px; /* Adjust width for square button */
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5); /* Optional shadow for depth */
      }

      /* Button inside the input group */
      #search-button {
        background: none; /* Transparent background to inherit parent */
        border: none; /* Remove button border */
        width: 100%; /* Take full width of the parent */
        height: 100%; /* Take full height of the parent */
        color: #f8f9fa; /* White icon for contrast */
        cursor: pointer; /* Pointer cursor for interactivity */
        font-size: 20px; /* Adjust icon size */
      }

      /* Button hover effect */
      #search-button:hover {
        color: #20c997; /* Change icon color on hover */
        transition: color 0.3s ease; /* Smooth hover effect */
      }

  
      .modal-content
      {
        background: linear-gradient(to bottom, #18bc9c, #128f76);
      }
      /* Scrollable column style */
      .scroll-container {
        max-height: 80vh;
        overflow-y: auto;
        overflow-x: hidden;
        background: #1a1a1a; /* Dark background for container */
        padding: 10px; /* Uniform padding */
        border: 1px solid #343a40; /* Border for clear separation */
        border-radius: 8px;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5); /* Inner shadow for depth */
      }
      .btn {
        color: #fff;
        background-color: #495057; /* Dark gray button */
        border: none;
        border-radius: 6px;
        font-weight: bold;
        transition: background 0.3s ease, transform 0.3s ease; /* Smooth effects */
      }
      .btn:hover {
        color: #20c997; /* Change icon color on hover */
        transition: color 0.3s ease; /* Smooth hover effect */
      }
      /* “Widgets” with DVD-like (2:3) ratio */
      .draggable-widget {
        width: 100px;
        height: 150px;
        background-color: #ccc;
        margin: 0 auto 1rem auto; /* center horizontally, space below */
        padding: 2px;
        cursor: move;
        border: 1px solid #999;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-weight: bold;
      }
  
      /* Simple styling for the trash area */
      .trash {
        min-height: 80%;
        border: 2px dashed #ccc;
        border-radius: 4px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e9ecef;
        background: linear-gradient(to bottom, #2c2c2c, #1a1a1a);
        margin-top: 20px; /* some spacing from the grid above */
      }
    </style>
</head>

<body>
  <!-- Add a bit of padding with p-4 so the content isn't touching screen edges -->
  <div class="container-fluid p-4 ">
    <div class="row">
      <!-- LEFT COLUMN: Buttons + Search bar + Scrollable draggable list -->
      <div class="col-md-3">

        <!-- ROW OF SMALL BUTTONS (TOP) -->
        <div class="mb-3">
          <div class="d-flex mb-2">
            <!-- You can change the icons or titles as desired -->
            <button type="button" class="btn btn-sm btn-primary me-2" id="search-switch" title="Movie">
              <i class="bi bi-film"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary me-2" id="search-switch" title="Actor">
              <i class="bi bi-person-bounding-box"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary me-2" id="search-switch" title="Director">
              <i class="bi bi-camera-reels"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary me-2" title="Gear">
              <i class="bi bi-gear"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" title="Misc">
              <i class="bi bi-three-dots"></i>
            </button>
          </div>
          
          <!-- Simple Search Bar -->
          <div class="input-group">
            <input 
              type="text" 
              id="search-input" 
              data-type="movie"
              class="form-control" 
              placeholder="Search..." 
              aria-label="Search..."
            />
            <div class="input-group-append">
              <span class="input-group-text">
                <button class="btn btn-sm bi bi-search" id="search-button"></button>
              </span>
            </div>
          </div>
        </div>

        <!-- Scrollable list of draggable widgets, displayed two per row -->
        <div class="scroll-container gs-3" id="scroll-grid">
          <div class="row" id="replace">                           
          </div>
        </div>
      </div>

<div class="col-md-8">
  <div class="grid-stack grid-stack-item grid-stack-sub-grid ui-droppable" id="advanced-grid"></div>

  <div class="d-flex justify-content-between mt-3">
    <!-- Clear Button -->
    <div class="align-self-start">
      <button id="clearAllBtn"
              type="button"
              class="btn btn-outline-secondary btn-lg px-4"
              style="font-weight: bold;">
        <i class="bi bi-brush"></i>
        Clear
      </button>
    </div>


    <!-- Spacer for center alignment -->
    <div class="flex-grow-1 d-flex justify-content-center">
      <!-- Recommend Button -->
      <button id="recommendBtn" type="button" 
              class="btn btn-success btn-lg px-5"
              style="background: #20c997; border: none; font-weight: bold;">
        Recommend
      </button>
    </div>
  </div>
</div>



      <!-- TRASH AREA: drag items here to remove -->
      <div class="col-md-1">
        <div id="trash" class="trash">
          <i class="bi bi-trash" style="font-size: 1.5rem; margin-right: 5px;"></i>
         <!-- Drop here to remove -->
        </div>
      </div>
    </div><!-- end .row -->
  </div><!-- end .container-fluid -->



  <!-- Recommend Modal -->
<div class="modal fade" id="recommendModal" tabindex="-1" aria-labelledby="recommendModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg"> <!-- make it large, or use .modal-xl for extra large -->
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="recommendModalLabel">Recommended Movies</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- todo in future fix filtering here -->
        <div id="recommendationContent" class="row">
          <!-- movies will be injected here -->
        </div>
      </div>
      <div class="modal-footer">
        <!-- something at the bottom?? :)? -->
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>


<!-- Movie Details Modal -->
<div class="modal" id="movieDetailsModal" tabindex="-1" aria-labelledby="movieDetailsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="movieDetailsModalLabel">Movie Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="movieDetailsContent">
        <!-- Movie details will be dynamically inserted here -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

  <!-- GridStack JS -->
  <script src="node_modules/gridstack/dist/gridstack-all.js"></script>
  <!-- Bootstrap JS (bundle includes Popper) -->
  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 1) Initialize the GridStack on the right, making the trash removable
      const grid = GridStack.init({
        float: true,      // let them float instead of auto-position
        acceptWidgets: true,
        removable: '#trash', // makes the #trash area remove items
        //columnWidth: 20,
        //cellHeight: 150,
        margin: '10px',
      }, '#advanced-grid');

      window.grid = grid; 


  // Setup drag-in for draggable widgets
  GridStack.setupDragIn('.scroll-container > .row > .col-6 > .grid-stack-item', {
  width: 3,  // grid columns
  height: 2, // grid rows
  });
 
  
  //dhruhil 
  const clearAllBtn = document.getElementById('clearAllBtn');

  clearAllBtn.addEventListener('click', function () {
    // Confirm action before clearing
    const confirmClear = confirm('Are you sure you want to clear the entire dashboard?');
    if (confirmClear) {
      const gridElement = document.getElementById('advanced-grid');
      const grid = GridStack.init({}, gridElement);

      // Remove all widgets from the grid
      grid.removeAll();
    }
  });

    });

  </script>

<script src="static/search.js"></script>
<script src="static/recommendBtn.js"></script>



</body>
</html>

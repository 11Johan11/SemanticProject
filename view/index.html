<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Drag and Drop</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- GridStack CSS -->
  <link rel="stylesheet" href="node_modules/gridstack/dist/gridstack.min.css" />

  <style>
    /* GridStack background + item styling */
.grid-stack {
  background: linear-gradient(to bottom, #f8f9fa, #e9ecef); /* Neutral gradient */
  min-height: 80vh; /* Ensure visibility */
  border-radius: 5px; /* Add slight rounding for a polished look */
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
}

.grid-stack-item {
  position: relative;
  overflow: hidden; /* Ensures content stays within bounds */
}

.widget-title-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  background-color: rgba(0, 0, 0, 0.7); /* Black background with transparency */
  color: white; /* Text color */
  padding: 10px; /* Add some padding for spacing */
  font-size: 16px; /* Adjust the font size as needed */
  font-weight: bold; /* Make the text bold */
  text-align: center; /* Center the title text */
  z-index: 1; /* Ensure it appears above the background image */
}
    .grid-stack-item-content {
      background-color: #18BC9C;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-weight: bold;
      text-align: center;
    }


    /* Scrollable column style */
    .scroll-container {
      max-height: 80vh; 
      overflow-y: auto;
      background: #f8f9fa;
      padding: 0.5rem; /* reduced padding */
    }

    /* “Widgets” with DVD-like (2:3) ratio */
    .draggable-widget {
      width: 100px;
      height: 150px;
      background-color: #ccc;
      margin: 0 auto 1rem auto; /* center horizontally, space below */
      padding: 2px;
      cursor: move;
      border: 1px solid #999;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
    }

    /* Simple styling for the trash area */
    .trash {
      min-height: 80%;
      border: 2px dashed #ccc;
      border-radius: 4px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f2f2;
      margin-top: 20px; /* some spacing from the grid above */
    }
  </style>
</head>

<body>
  <!-- Add a bit of padding with p-4 so the content isn't touching screen edges -->
  <div class="container-fluid p-4 ">
    <div class="row">
      <!-- LEFT COLUMN: Buttons + Search bar + Scrollable draggable list -->
      <div class="col-md-3">

        <!-- ROW OF SMALL BUTTONS (TOP) -->
        <div class="mb-3">
          <div class="d-flex mb-2">
            <!-- You can change the icons or titles as desired -->
            <button type="button" class="btn btn-sm btn-outline-secondary me-2" id="search-switch" title="Movie">
              <i class="bi bi-film"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary me-2" id="search-switch" title="Actor">
              <i class="bi bi-person-bounding-box"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary me-2" id="search-switch" title="Camera">
              <i class="bi bi-camera-reels"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary me-2" title="Gear">
              <i class="bi bi-gear"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" title="Misc">
              <i class="bi bi-three-dots"></i>
            </button>
          </div>
          
          <!-- Simple Search Bar -->
          <div class="input-group">
            <input 
              type="text" 
              id="search-input" 
              data-type="movie"
              class="form-control" 
              placeholder="Search..." 
              aria-label="Search..."
            />
            <div class="input-group-append">
              <span class="input-group-text">
                <i class="bi bi-search"></i>
              </span>
            </div>
          </div>
        </div>

        <!-- Scrollable list of draggable widgets, displayed two per row -->
        <div class="scroll-container gs-3" id="scroll-grid">
          <div class="row" id="replace">
            <div class="col-6"> 
              <div class="grid-stack-item draggable-widget newWidget" gs-x="2" gs-y="2" gs-w="2" gs-h="2">
                <ion-icon name="add-circle" role="img" class="md hydrated" aria-label="add circle"></ion-icon>
                <div>Drag me in the dashboard!</div>
              </div>
            </div>
            <div class="col-6">
              <div class="grid-stack-item draggable-widget newWidget" gs-x="2" gs-y="2" gs-w="2" gs-h="2">
                <ion-icon name="add-circle" role="img" class="md hydrated" aria-label="add circle"></ion-icon>
                <div>Drag me in the dashboard!</div>
              </div>
            </div>   
            <div class="col-6">
              <div class="grid-stack-item draggable-widget newWidget" gs-x="2" gs-y="2" gs-w="2" gs-h="2">
                <ion-icon name="add-circle" role="img" class="md hydrated" aria-label="add circle"></ion-icon>
                <div>Drag me in the dashboard!</div>
              </div>
            </div>                             
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: Main GridStack area -->
      <div class="col-md-8">
        <div class="grid-stack grid-stack-item grid-stack-sub-grid ui-droppable" id="advanced-grid"></div>
        
        <!-- Recommend Button at the bottom of the advanced grid -->
        <div class="d-flex justify-content-center mt-3">
          <button id="recommendBtn" type="button" 
                  class="btn btn-success btn-lg px-5" 
                  style="background: #20c997; border: none; font-weight: bold;">
            Recommend
          </button>
        </div>
      </div><!-- end .col-md-8 -->

      <!-- TRASH AREA: drag items here to remove -->
      <div class="col-md-1">
        <div id="trash" class="trash">
          <i class="bi bi-trash" style="font-size: 1.5rem; margin-right: 5px;"></i>
         <!-- Drop here to remove -->
        </div>
      </div>
    </div><!-- end .row -->
  </div><!-- end .container-fluid -->

  <!-- GridStack JS -->
  <script src="node_modules/gridstack/dist/gridstack-all.js"></script>
  <!-- Bootstrap JS (bundle includes Popper) -->
  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 1) Initialize the GridStack on the right, making the trash removable
      const grid = GridStack.init({
        float: true,      // let them float instead of auto-position
        acceptWidgets: true,
        removable: '#trash', // makes the #trash area remove items
        columnWidth: 20,
        cellHeight: 150,
        margin: '10px',
      }, '#advanced-grid');



  // Setup drag-in for draggable widgets
  GridStack.setupDragIn('.scroll-container > .row > .col-6 > .grid-stack-item', {
  width: 3,  // grid columns
  height: 2, // grid rows
  });
 
        //CLICK TO ADD TO GRID (FOR LAZY PPL)
function addWidgetToGrid(item) {
  const metadata = JSON.parse(item.getAttribute('data-meta'));

  // Create the widget HTML as a string
  const widgetHTML = `
    <div class="grid-stack-item" data-meta='${JSON.stringify(metadata)}' gs-w="3" gs-h="2">
      <div class="grid-stack-item-content" 
           style="background-image: url('${metadata.poster}'); background-size: cover; background-position: center;">
        <div class="widget-title-bar">${metadata.title}</div>
      </div>
    </div>`;

  // Parse the HTML string into a DOM element
  const template = document.createElement('template');
  template.innerHTML = widgetHTML.trim();
  const widgetElement = template.content.firstChild;

  // Add the widget to the grid
  grid.makeWidget(widgetElement);
}


          //attach click event to each draggable widget
          const scrollContainer = document.getElementById('replace');
          scrollContainer.addEventListener('click', function (event) {
            const target = event.target.closest('.draggable-widget');
            if (target) {
              addWidgetToGrid(target);
            }
          });
    });

  </script>

<script src="static/search.js"></script>
<script src="static/recommendBtn.js"></script>



</body>
</html>
